name: Add verified financial dataset

on:
  push:
    paths:
      - .github/workflows/prepare-data.yml

permissions:
  contents: write

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pandas openpyxl
      - name: Download, prepare and validate data
        run: |
          curl -L --fail --retry 3 -o /tmp/financial_sample.xlsx "https://download.microsoft.com/download/1/4/E/14EDED28-6C58-4055-A65C-23B4DA81C4DE/Financial%20Sample.xlsx"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import numpy as np
          import pandas as pd

          data = pd.read_excel("/tmp/financial_sample.xlsx")
          data.columns = data.columns.str.strip()
          data = data.rename(columns={"Sales": "Net Sales"})
          data["Discount Band"] = data["Discount Band"].fillna("None")
          data["Date"] = data["Date"].dt.strftime("%Y-%m-%d")
          data["Profit Margin"] = np.where(data["Net Sales"] != 0, data["Profit"] / data["Net Sales"], np.nan)
          data["Discount Rate"] = np.where(data["Gross Sales"] != 0, data["Discounts"] / data["Gross Sales"], np.nan)
          data["Loss Making Flag"] = (data["Profit"] < 0).astype("int8")

          assert len(data) == 700
          assert round(data["Net Sales"].sum(), 2) == 118726350.26
          assert round(data["Profit"].sum(), 2) == 16893702.26
          assert int(data["Loss Making Flag"].sum()) == 58

          target = Path("data/financial_sample_clean.csv")
          target.parent.mkdir(parents=True, exist_ok=True)
          data.to_csv(target, index=False, lineterminator="\n")
          checksum = hashlib.sha256(target.read_bytes()).hexdigest()
          Path("data/README.md").write_text(f"""# Data

## File

`financial_sample_clean.csv` contains 700 financial sample records and 19 columns.

## Source

- Dataset: Microsoft Financial Sample workbook
- URL: https://learn.microsoft.com/en-us/power-bi/create-reports/sample-financial-download
- Publisher: Microsoft

## Preparation

Column whitespace was removed, `Sales` was renamed `Net Sales`, blank discount bands were labelled `None`, and dates use `YYYY-MM-DD`. `Profit Margin`, `Discount Rate` and `Loss Making Flag` were added using the documented reconciliation rules.

## Validation

| Check | Result |
|---|---:|
| Records | 700 |
| Net sales | $118,726,350.26 |
| Profit | $16,893,702.26 |
| Profit margin | 14.23% |
| Units sold | 1,125,806 |
| Discounts | $9,205,248.24 |
| Loss-making records | 58 |

SHA-256: `{checksum}`
""", encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "- [ ] Add cleaned data and reproducible preparation code",
              "- [x] Add cleaned data with source and validation notes\n- [ ] Add reproducible preparation code",
          )
          readme.write_text(text, encoding="utf-8")
          Path(".github/workflows/prepare-data.yml").unlink()
          PY
      - name: Commit dataset
        run: |
          git config user.name "Sunil Chaudhary"
          git config user.email "152345771+sunil914@users.noreply.github.com"
          git add README.md data .github/workflows/prepare-data.yml
          git commit -m "data: add validated financial dataset"
          git push
